name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # 启用 Nx Cloud 分布式任务
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="acceptance"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - run: pnpm install --frozen-lockfile

      # 阶段 1：格式检查（快速失败）
      - name: Format check
        run: npx nx record -- pnpm format:check

      # 阶段 2：developer 自验证（lint + typecheck + 单测 + build）
      - name: Developer check (lint / typecheck / unit test / build)
        run: npx nx affected -t check --base=origin/main

      # 阶段 3：tester 验收（集成测试、验收测试）
      - name: Tester acceptance
        run: npx nx affected -t acceptance --base=origin/main

      # Nx Cloud self-healing
      - run: npx nx fix-ci
        if: always()
