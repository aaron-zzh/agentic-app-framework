name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: aaf-dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - run: pnpm format:check

      - run: pnpm check:specs

      - run: pnpm check:affected
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: aaf-dev
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload service coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: apps/service/aaf-api/target/site/jacoco/jacoco.xml
          flags: service
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload webui coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: apps/webui/coverage/coverage-final.json
          flags: webui
          token: ${{ secrets.CODECOV_TOKEN }}

      # TODO: mp-weixin 构建暂时跳过
      # 已知问题：@vueuse/core@11.x 中 TransitionGroup 在 UniApp 小程序环境下不兼容
      # 修复方向：降级 @vueuse/core 或适配 UniApp Vue 精简包，待后续迭代处理
      # - name: Build uniapp (mp-weixin)
      #   run: pnpm nx run uniapp:build:mp-weixin

      - name: Build uniapp (H5)
        run: pnpm nx run uniapp:build

      # mp-weixin artifact 暂时跳过，待 mp-weixin 构建修复后恢复
      # - name: Upload uniapp mp-weixin artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: uniapp-mp-weixin
      #     path: apps/uniapp/dist/build/mp-weixin/
      #     retention-days: 7

      - name: Upload uniapp H5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: uniapp-h5
          path: apps/uniapp/dist/build/h5/
          retention-days: 7
