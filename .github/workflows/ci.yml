name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: aaf-dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - run: pnpm format:check

      - run: pnpm check:specs

      - run: pnpm check:affected
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: aaf-dev
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload service coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: apps/service/aaf-api/target/site/jacoco/jacoco.xml
          flags: service
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload webui coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: apps/webui/coverage/coverage-final.json
          flags: webui
          token: ${{ secrets.CODECOV_TOKEN }}
