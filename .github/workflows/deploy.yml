name: Deploy to Aliyun

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}   # 含命名空间，例：registry.cn-hangzhou.aliyuncs.com/aaronzzh

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./apps/service
          push: true
          tags: ${{ env.ACR_REGISTRY }}/service:latest
          no-cache: true

      - name: 加载前端构建变量（.env.prod）
        run: grep -v '^\s*#' apps/webui/.env.prod | grep -v '^\s*$' >> $GITHUB_ENV

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/webui/Dockerfile
          push: true
          tags: ${{ env.ACR_REGISTRY }}/webui:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PUBLIC_API_URL }}
            NEXT_PUBLIC_TLDRAW_LICENSE_KEY=${{ secrets.TLDRAW_LICENSE_KEY }}
            NEXT_PUBLIC_ASSETS_URL=${{ env.NEXT_PUBLIC_ASSETS_URL }}
            NEXT_PUBLIC_CAPTCHA_ENABLED=${{ env.NEXT_PUBLIC_CAPTCHA_ENABLED }}
            NEXT_PUBLIC_CAPTCHA_REGION=${{ env.NEXT_PUBLIC_CAPTCHA_REGION }}
            NEXT_PUBLIC_CAPTCHA_PREFIX=${{ env.NEXT_PUBLIC_CAPTCHA_PREFIX }}
            NEXT_PUBLIC_CAPTCHA_SCENE_ID=${{ env.NEXT_PUBLIC_CAPTCHA_SCENE_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 部署到 ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # GitHub 环境保护，需人工审批

    steps:
      - uses: actions/checkout@v4

      - name: 上传部署文件到 ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: /root/aaf

      - name: 上传 Nginx 配置到 ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "scripts/deploy/nginx/"
          target: /root/aaf/nginx
          strip_components: 3

      - name: 上传 Postgres 配置到 ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "scripts/deploy/postgres/"
          target: /root/aaf/postgres
          strip_components: 3

      - name: SSH 部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            mkdir -p /root/aaf/ssl /root/aaf/logs/nginx /root/aaf/logs/service
            chmod 777 /root/aaf/logs/service /root/aaf/logs/nginx
            cd /root/aaf

            # 登录 ACR（ECS 内网拉取更快）
            docker login ${{ secrets.ACR_REGISTRY }} \
              -u ${{ secrets.ACR_USERNAME }} \
              -p ${{ secrets.ACR_PASSWORD }}

            # 拉取最新镜像并滚动重启（不重启 DB/Redis）
            export ACR_REGISTRY=${{ secrets.ACR_REGISTRY }}
            docker compose pull aaf-service aaf-webui
            docker compose up -d --no-deps aaf-service aaf-webui nginx

            # 清理旧镜像
            docker image prune -f
