name: Bug 报告
description: 提交一个 Bug
title: '[Bug] '
labels: ['bug']
body:
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 后端 (service)
        - 前端 (webui)
        - 移动端 (uniapp)
        - 文档
        - CI/CD
        - 其他
    validations:
      required: true

  - type: textarea
    id: reproduce-steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境信息
      placeholder: |
        - OS:
        - Node:
        - pnpm:
        - 浏览器/平台:
