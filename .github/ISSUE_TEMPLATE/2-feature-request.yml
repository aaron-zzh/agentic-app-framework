name: 功能需求
description: 提出新功能或改进建议
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题？
      description: 描述使用场景和痛点
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 描述你希望的实现方式或 API 设计
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案（可选）
      description: 你考虑过哪些替代方案
