# AAF Docker Compose - 生产覆盖层
# 使用方式：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 与 docker-compose.yml 的区别：
# - aaf-service/aaf-webui 改为拉取 ACR 镜像（不本地 build）
# - 新增 nginx 反向代理（80/443）
# - 移除 DB 对外暴露端口（仅容器内网访问）
# - 启用日志限制

services:
  postgres:
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    ports: !reset []  # 生产不对外暴露

  aaf-service:
    image: ${ACR_REGISTRY}/service:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      SPRING_PROFILES_ACTIVE: prod
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
    ports: !reset []  # 由 nginx 代理，不直接暴露
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

  aaf-webui:
    image: ${ACR_REGISTRY}/webui:${IMAGE_TAG:-latest}
    build: !reset null
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://your-domain.com}
    ports: !reset []  # 由 nginx 代理，不直接暴露
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

  # Nginx 反向代理
  nginx:
    image: ${ACR_REGISTRY}/nginx:stable-alpine
    container_name: aaf-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/aaf.conf:/etc/nginx/conf.d/aaf.conf:ro
      - ${SSL_CERT_DIR}:/etc/ssl/aaf:ro   # 必须在 .env 中配置，如 SSL_CERT_DIR=/root/aaf/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - aaf-service
      - aaf-webui
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

volumes:
  nginx_logs:
