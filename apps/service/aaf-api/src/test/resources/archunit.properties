# ArchUnit FreezingArchRule 违规基线存储配置
# 首次运行自动生成基线（记录当前存量违规为"已接受"）；之后只拦截新增违规。
# 基线目录 archunit_store/ 应提交到 Git，使 CI 与本地一致。
# 存量控制器按 10-authorization-matrix.md 加鉴权注解后，对应冻结项会自动移除。
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreUpdate=true
