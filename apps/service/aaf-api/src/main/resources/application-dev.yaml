spring:
  autoconfigure:
    exclude:
      # 按需取消注释以禁用特定自动配置
      # - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
      # Neo4j 相关-当前必备，先保留这段
      # - org.springframework.boot.neo4j.autoconfigure.Neo4jAutoConfiguration
      # - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
      # - org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aaf-dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    clean-disabled: false
    validate-on-migrate: false
    locations: classpath:db/migration,classpath:db/seed,classpath:db/testdata
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j}
  data:
    neo4j:
      schema-generate: create
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  graphql:
    graphiql:
      enabled: true # 开发环境启用 GraphiQL 调试界面（访问 /graphiql）
    schema:
      printer:
        enabled: true
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.ssl.enable: true
  jpa:
    show-sql: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${OPENAI_MODEL:deepseek-v4-pro}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
    vectorstore:
      pgvector:
        table-name: knowledge_embedding
        dimensions: 1536
        distance-type: cosine_distance
        index-type: hnsw
        initialize-schema: false

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.web.filter.AbstractRequestLoggingFilter: DEBUG

aaf:
  flyway:
    clean-on-start: true
  ai:
    # 模型兜底配置：优先级 DB配置 → 此处yaml → Spring AI默认值
    # 数据库模型管理上线后，此处作为 DB 不可用时的 fallback，建议保留
    midjourney:
      enabled: ${MJ_ENABLED:false}
      base-url: ${MJ_BASE_URL:https://api.holdai.top/mj}
      api-key: ${MJ_API_KEY:}
      notify-url: ${MJ_NOTIFY_URL:}
    models:
      default:
        provider: openai
        api-key: ${OPENAI_API_KEY:sk-placeholder}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        model: ${OPENAI_MODEL:gpt-4o-mini}
        max-tokens: 4096
        temperature: 0.7
  storage:
    type: local
    local:
      base-path: ${user.home}/aaf-files
      url-prefix: /files
  messaging:
    # dev 默认不启用短信，避免无配置时启动失败；需要时取消注释并填写 .env
    sms:
      provider: aliyun
      aliyun:
        access-key-id: ${SMS_ACCESS_KEY_ID:}
        access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
        sign-name: ${SMS_SIGN_NAME:AAF}
    email:
      from: ${EMAIL_FROM:noreply@xuejiai.com}
  security:
    mock-enable: true
    jwt:
      secret: ${JWT_SECRET:aaf-dev-secret-must-be-at-least-32-bytes-long!!}
      expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
    oauth:
      wechat:
        app-id: ${WECHAT_APP_ID:}
        app-secret: ${WECHAT_APP_SECRET:}
        redirect-uri: ${WECHAT_REDIRECT_URI:http://localhost:3000/auth/callback/wechat}
      wecom:
        corp-id: ${WECOM_CORP_ID:}
        agent-id: ${WECOM_AGENT_ID:}
        secret: ${WECOM_SECRET:}
        redirect-uri: ${WECOM_REDIRECT_URI:http://localhost:3000/auth/callback/wecom}
      dingtalk:
        app-key: ${DINGTALK_APP_KEY:}
        app-secret: ${DINGTALK_APP_SECRET:}
        redirect-uri: ${DINGTALK_REDIRECT_URI:http://localhost:3000/auth/callback/dingtalk}
  # ── 示例模块（按需开启，需配置 DASHSCOPE_API_KEY）────────────────
  examples:
    agentscope:
      enabled: true
      mcp:
        # NWS 天气 MCP（美国国家气象局，免费无需认证）
        # 留空则 mcpToolAgent 以无工具模式运行
        server-url: ${MCP_SERVER_URL:https://nws.caseyjhand.co}
        transport: ${MCP_TRANSPORT:streamable-http}

agentscope:
  a2a:
    server:
      card:
        name: AAF Supervisor Agent
        description: AAF 多智能体协作框架 - Supervisor Agent，支持日程管理等任务委托
        version: 0.1.0
