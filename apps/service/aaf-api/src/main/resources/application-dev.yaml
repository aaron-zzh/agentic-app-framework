spring:
  autoconfigure:
    exclude:
      # AI 相关
      # - org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration
      # - org.springframework.ai.model.chat.memory.autoconfigure.ChatMemoryAutoConfiguration
      # - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
      # Neo4j 相关
      # - org.springframework.boot.neo4j.autoconfigure.Neo4jAutoConfiguration
      # - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
      # - org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aaf-dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    clean-disabled: false
    # 开发阶段频繁修改 V1，跳过校验；启动前手动 clean 或删库重建
    validate-on-migrate: false
    locations: classpath:db/migration-new,classpath:db/testdata
  data:
    neo4j:
      uri: ${NEO4J_URI:bolt://localhost:7687}
      authentication:
        username: ${NEO4J_USERNAME:neo4j}
        password: ${NEO4J_PASSWORD:neo4j}
      schema-generate: create
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.ssl.enable: true
  jpa:
    show-sql: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
    vectorstore:
      pgvector:
        table-name: knowledge_embedding
        dimensions: 1536
        distance-type: cosine_distance
        index-type: hnsw
        initialize-schema: false

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.web.filter.AbstractRequestLoggingFilter: DEBUG

aaf:
  flyway:
    clean-on-start: true
  ai:
    default-model: default
    fallback-model: default
    models:
      default:
        provider: openai
        api-key: ${OPENAI_API_KEY:sk-placeholder}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        model: ${OPENAI_MODEL:gpt-4o-mini}
        max-tokens: 4096
        temperature: 0.7
    prompts:
      chat: 你是一个有帮助的 AI 助手，请用中文回答用户的问题。
  task:
    scheduler:
      pool-size: 4
    queue:
      consumer-threads: 2
      poll-timeout: 5s
  storage:
    type: local
    local:
      base-path: ${user.home}/aaf-files
      url-prefix: /files
  messaging:
    sms:
      provider: aliyun
      aliyun:
        access-key-id: ${SMS_ACCESS_KEY_ID:}
        access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
        sign-name: ${SMS_SIGN_NAME:AAF}
    email:
      from: ${EMAIL_FROM:noreply@xuejiai.com}
  security:
    mock-enable: true
    jwt:
      secret: ${JWT_SECRET:aaf-dev-secret-must-be-at-least-32-bytes-long!!}
      expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
    oauth:
      wechat:
        app-id: ${WECHAT_APP_ID:}
        app-secret: ${WECHAT_APP_SECRET:}
        redirect-uri: ${WECHAT_REDIRECT_URI:http://localhost:3000/auth/callback/wechat}
      wecom:
        corp-id: ${WECOM_CORP_ID:}
        agent-id: ${WECOM_AGENT_ID:}
        secret: ${WECOM_SECRET:}
        redirect-uri: ${WECOM_REDIRECT_URI:http://localhost:3000/auth/callback/wecom}
      dingtalk:
        app-key: ${DINGTALK_APP_KEY:}
        app-secret: ${DINGTALK_APP_SECRET:}
        redirect-uri: ${DINGTALK_REDIRECT_URI:http://localhost:3000/auth/callback/dingtalk}
