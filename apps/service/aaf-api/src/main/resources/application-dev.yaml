# 开发环境专属配置（调试 / mock / 危险开关）。
# 基础设施与 env 驱动配置（DB/Redis/Neo4j/Mail/AI/security/storage 等）见 application.yaml。
spring:
  autoconfigure:
    exclude:
      # 按需取消注释以禁用特定自动配置
      # - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
      # Neo4j 相关-当前必备，先保留这段
      # - org.springframework.boot.neo4j.autoconfigure.Neo4jAutoConfiguration
      # - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
      # - org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration
  flyway:
    clean-disabled: false
    validate-on-migrate: false
    # 在公共 migration,seed 基础上追加 dev 测试数据
    locations: classpath:db/migration,classpath:db/seed,classpath:db/testdata
  data:
    neo4j:
      schema-generate: create
  graphql:
    graphiql:
      enabled: true # 开发环境启用 GraphiQL 调试界面（访问 /graphiql）
    schema:
      printer:
        enabled: true
  jpa:
    show-sql: false

logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.web.filter.AbstractRequestLoggingFilter: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.xuejiai.aaf.module.ai: DEBUG
    com.xuejiai.aaf.module.system: DEBUG
    com.xuejiai.aaf.module.channel: DEBUG
    org.springframework.web.context.request.async: WARN
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

aaf:
  demo:
    enabled: true  # dev 环境开启演示模式，暴露 /api/system/demo/load 和 /clean
  flyway:
    clean-on-start: true # ⚠️ 仅 dev：启动时清库重建
  pay:
    # 开发环境启用模拟支付渠道；生产默认关闭（MockPayChannelAdapter @ConditionalOnProperty）
    mock:
      enabled: true
    # 支付宝支付配置（开发环境可使用沙箱环境测试）
    alipay:
      enabled: true
      # 沙箱环境网关（正式环境使用 https://openapi.alipay.com/gateway.do）
      server-url: ${ALIPAY_SERVER_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      app-id: ${ALIPAY_APP_ID:9021000165620830}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
      notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/pay/order/notify/alipay}
      return-url: ${ALIPAY_RETURN_URL:http://localhost:3000/billing/success}
  security:
    mock-enable: true # ⚠️ 仅 dev：mock 认证，生产必须为 false
  # ── 示例模块（按需开启，需配置 DASHSCOPE_API_KEY）────────────────
  examples:
    agentscope:
      enabled: true
      mcp:
        # NWS 天气 MCP（美国国家气象局，免费无需认证）
        # 留空则 mcpToolAgent 以无工具模式运行
        server-url: ${MCP_SERVER_URL:https://nws.caseyjhand.co}
        transport: ${MCP_TRANSPORT:streamable-http}
  license:
    signing:
      private-key-file: ${AAF_LICENSE_KEY_FILE:~/.aaf/signing.key}
    identity:
      checksum-salt: ${AAF_LICENSE_CHECKSUM_SALT:aaf-license-user:v1:}
      seed-salt: ${AAF_LICENSE_SEED_SALT:aaf-license-seed:v1:}

# 示例模块开启后存在 ReActAgent Bean（supervisorAgent 等），可派生 AgentRunner，
# 因此 dev 下启用 AgentScope A2A Server 暴露 AgentCard（card 内容见 application.yaml）。
agentscope:
  a2a:
    server:
      enabled: true
