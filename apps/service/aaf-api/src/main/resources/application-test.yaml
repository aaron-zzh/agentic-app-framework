spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aaf_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    clean-disabled: false
    validate-on-migrate: false
    locations: classpath:db/migration-new
  data:
    neo4j:
      uri: ${NEO4J_URI:bolt://localhost:7687}
      authentication:
        username: ${NEO4J_USERNAME:neo4j}
        password: ${NEO4J_PASSWORD:neo4j}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    show-sql: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}

aaf:
  flyway:
    clean-on-start: true
  security:
    mock-enable: true
    jwt:
      secret: ${JWT_SECRET:aaf-test-secret-must-be-at-least-32-bytes-long!}
      expire-seconds: 3600
  messaging:
    email:
      from: noreply@test.local
