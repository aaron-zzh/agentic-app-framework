# 演示/生产环境配置。
# 公共底座（DB/Redis/Neo4j/Mail/AI/security/storage 等）由 application.yaml 提供，经环境变量(.env)注入真实值。
# 本文件只覆盖与公共底座不同的安全/噪音差异项：
# - 禁止 flyway clean（防误删数据）
# - 关闭 mock 认证（使用真实 JWT，靠 JWT_SECRET 环境变量）
# - 关闭 show-sql / clean-on-start
# - 关闭 API 文档（不在生产暴露 swagger / api-docs）
# - m7：由网关/LB 的转发头改写 remoteAddr，应用侧不再自行解析可伪造的 X-Forwarded-For
server:
  # m7：仅在"应用只能经网关/LB 访问"的生产拓扑下开启——此时 X-Forwarded-* 由代理覆写并剥离客户端伪造值，
  # Spring ForwardedHeaderFilter 据此改写 remoteAddr；若应用可被直连访问，绝不能开启（等于放开 IP 伪造）
  forward-headers-strategy: framework
spring:
  config:
    import: optional:file:.env[.properties]
  flyway:
    clean-disabled: true # 生产禁止 clean
  jpa:
    show-sql: false

aaf:
  flyway:
    clean-on-start: false # 生产禁止启动清库
  pay:
    mock:
      enabled: false # B2：生产禁用 Mock 支付渠道（配置层显式关闭，Bean 层另有 @Profile("!prod") 兜底）
  security:
    mock-enable: false # 关闭 mock 认证，使用真实 JWT
  prompt:
    source-sync:
      mode: PROD_DRAFT # 生产：MD 仅导入 Draft，必须调用 PromptPublicationService 手动发布
  messaging:
    sms:
      test-send:
        enabled: false # M21：生产环境默认禁用测试发送，避免误发真实短信产生费用；确需验证配置时改为白名单模式

springdoc:
  api-docs:
    enabled: false # 生产关闭 OpenAPI 文档端点
  swagger-ui:
    enabled: false # 生产关闭 Swagger UI


management:
  endpoints:
    web:
      exposure:
        include: health,prometheus # 生产最小暴露；loggers/info 不通过 Web 开放
