spring:
  application:
    name: aaf
    version: '@project.version@'
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    context-path: /
