spring:
  application:
    name: aaf
    version: '@project.version@'
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    placeholder-replacement: false

server:
  servlet:
    context-path: /

aaf:
  app:
    company-name: ${AAF_COMPANY_NAME:学记智能}
  ai:
    default-model: default
    fallback-model: default
    # 各能力兜底 modelId，优先级：DB(ai_model_preference) > 此处 > 代码内置默认值
    default-models:
      IMAGE_GEN: qwen-image-plus
      VIDEO_GEN: wan2.6-i2v-flash
      SPEECH_ASR: paraformer-realtime-v2
      SPEECH_TTS: cosyvoice-v3-flash
      RERANK: gte-rerank-v2
      EMBEDDING: text-embedding-v3
    prompts:
      chat: 你是一个有帮助的 AI 助手，请用中文回答用户的问题。
  task:
    scheduler:
      pool-size: 4
    queue:
      consumer-threads: 2
      poll-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: aaf

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
