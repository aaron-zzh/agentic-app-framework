spring:
  application:
    name: aaf
    version: "@project.version@"
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aaf-dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    placeholder-replacement: false
    sql-migration-prefix: v
    # 公共迁移 + 种子数据；dev 额外追加 db/testdata（见 application-dev.yaml）
    locations: classpath:db/migration,classpath:db/seed
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10s          # 命令超时，必须 > poll-timeout，留足余量
      connect-timeout: 3s   # 连接超时
      lettuce:
        pool:
          max-active: 16    # 最大连接数
          max-idle: 8
          min-idle: 2
          max-wait: 2s      # 获取连接等待超时
        shutdown-timeout: 200ms
      repositories:
        enabled: false
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.ssl.enable: true
      # 超时收紧——同步发送验证码场景下，前端最多等 5s 拿到失败响应，避免 SMTP 默认 -1（无超时）导致用户卡 22s
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${OPENAI_MODEL:deepseek-v4-pro}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
    vectorstore:
      pgvector:
        table-name: knowledge_embedding
        dimensions: 1536
        distance-type: cosine_distance
        index-type: hnsw
        initialize-schema: false

server:
  servlet:
    context-path: /

aaf:
  demo:
    enabled: ${AAF_DEMO_ENABLED:false}  # 演示模式：开启后注册 /api/system/demo/load 和 /clean 接口
  app:
    company-name: ${AAF_COMPANY_NAME:学记智能}
    frontend-url: ${AAF_WEB_ORIGIN:http://localhost:3000}
  storage:
    # 存储类型：local（本地）/ s3（MinIO/S3 兼容）/ oss（阿里云原生，支持 STS 分片直传）
    type: ${STORAGE_TYPE:local}
    local:
      base-path: ${AAF_FILE_PATH:${user.home}/aaf-files}
      url-prefix: ${AAF_FILE_DOMAIN:http://localhost:8080}/api/system/files
    s3:
      # MinIO 示例：http://localhost:9000；AWS S3：https://s3.<region>.amazonaws.com
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:${MINIO_ACCESS_KEY:}}
      secret-key: ${S3_SECRET_KEY:${MINIO_SECRET_KEY:}}
      bucket-name: ${S3_BUCKET:aaf}
      region: ${S3_REGION:cn-hangzhou}
    oss:
      # 阿里云 OSS endpoint，如 oss-cn-hangzhou.aliyuncs.com
      endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
      bucket-name: ${OSS_BUCKET:}
      # 用于调用 STS 的 RAM 用户长期凭证（不是 STS 临时凭证）
      access-key-id: ${OSS_ACCESS_KEY_ID:dev-placeholder}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:dev-placeholder}
      # RAM 角色 ARN：acs:ram::<uid>:role/<role-name>，前端直传分片必需
      role-arn: ${OSS_ROLE_ARN:}
      sts-endpoint: ${OSS_STS_ENDPOINT:sts.aliyuncs.com}
      # 对象访问 URL 前缀（可选）；为空时回退 https://<bucket>.<endpoint>/<key>
      url-prefix: ${OSS_URL_PREFIX:}
      # STS 凭证有效期（秒），最小 900，默认 3600
      duration-seconds: ${OSS_DURATION_SECONDS:3600}
  cors:
    allowed-origin-patterns:
      - ${AAF_WEB_ORIGIN:http://localhost:3000}
      - http://127.0.0.1:3000
    allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed-headers: ["*"]
    allow-credentials: true
    max-age: 3600
  ai:
    default-model: deepseek:chat
    fallback-model: default
    midjourney:
      enabled: ${MJ_ENABLED:false}
      base-url: ${MJ_BASE_URL:https://api.holdai.top/mj}
      api-key: ${MJ_API_KEY:}
      notify-url: ${MJ_NOTIFY_URL:}
    # OPENAI_COMPAT 链路凭证 fallback：key = AiModel.provider，由 DynamicChatClientFactory 读取
    # （仅当 ai_model 记录未填 api-key/base-url 时生效）
    models:
      default:
        provider: openai
        api-key: ${OPENAI_API_KEY:sk-placeholder}
        base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
        model: ${OPENAI_MODEL:gpt-4o-mini}
        max-tokens: 4096
        temperature: 0.7
      # qwen chat 走百炼 OpenAI 兼容端点 compatible-mode，key 复用百炼账号 DASHSCOPE_API_KEY
      qwen:
        api-key: ${DASHSCOPE_API_KEY:}
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # 各能力兜底 modelId，优先级：DB(ai_model_preference) > 此处 > 代码内置默认值
    default-models:
      CHAT: deepseek:chat
      IMAGE_GEN: qwen:wan2.7-image
      VIDEO_GEN: qwen:happyhorse-1.1-i2v
      SPEECH_ASR: qwen:fun-asr-realtime
      SPEECH_TTS: qwen:cosyvoice-v3-flash
      MUSIC_GEN: qwen:fun-music-v1
      OMNI_REALTIME: qwen:qwen3-omni-flash-realtime
      RERANK: qwen:qwen3-rerank
      EMBEDDING: qwen:text-embedding-v4
    prompts:
      chat: 你是一个有帮助的 AI 助手，请用中文回答用户的问题。
  messaging:
    # 验证码发送渠道：EMAIL（默认）/ DINGTALK（开发调试用，推到钉钉群机器人）/ SMS
    verify-code-channel: ${VERIFY_CODE_CHANNEL:EMAIL}
    sms:
      provider: aliyun
      aliyun:
        access-key-id: ${SMS_ACCESS_KEY_ID:}
        access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
        sign-name: ${SMS_SIGN_NAME:AAF}
    email:
      from: ${EMAIL_FROM:noreply@xuejiai.com}
    # 【钉钉①】自定义机器人：主动推送消息到群（验证码调试、系统通知）, 在钉钉群里添加自定义机器人后获取 access_token 和加签密钥
    dingtalk:
      api-key: ${DINGTALK_BOT_TOKEN:c4276c598eeb3ec929934ad6e191d2049d92211eacba85c40f02f5b35b16e390}
      secret: ${DINGTALK_SECRET:SECd7950093c3b96abf8e865abfbcad43bd5c7ecef1e74ca2a4e3ae2100a5cf3bda}
  security:
    jwt:
      secret: ${JWT_SECRET:aaf-dev-secret-must-be-at-least-32-bytes-long!!}
      expire-seconds: ${JWT_EXPIRE_SECONDS:604800}
    oauth:
      wechat:
        app-id: ${WECHAT_APP_ID:}
        app-secret: ${WECHAT_APP_SECRET:}
        redirect-uri: ${WECHAT_REDIRECT_URI:}
      # 企业微信：OAuth 登录 + 企业应用消息推送（工作通知）+ 接收员工消息，共用同一个企业自建应用
      # 在企业微信管理后台（work.weixin.qq.com）创建自建应用后获取
      # corp-id: 企业 ID，agent-id: 应用 AgentId，secret: 应用 Secret
      wecom:
        corp-id: ${WECOM_CORP_ID:}
        agent-id: ${WECOM_AGENT_ID:}
        secret: ${WECOM_SECRET:}
        redirect-uri: ${WECOM_REDIRECT_URI:}
      # 【钉钉②③】企业内部应用：OAuth 登录 + Stream 机器人消息接收（AI 对话）共用同一个应用
      # 在钉钉开放平台（open.dingtalk.com）创建企业内部应用后获取
      dingtalk:
        client-id: ${DINGTALK_CLIENT_ID:}
        client-secret: ${DINGTALK_CLIENT_SECRET:}
        redirect-uri: ${DINGTALK_REDIRECT_URI:}
  channel:
    # 企业内部应用机器人 Stream 模式（接收用户消息/AI 对话），复用上方 DINGTALK_CLIENT_ID/SECRET
    dingtalk:
      enabled: ${DINGTALK_ENABLED:false}
      client-id: ${DINGTALK_CLIENT_ID:}
      client-secret: ${DINGTALK_CLIENT_SECRET:}
      webhook-url: ${DINGTALK_BOT_WEBHOOK_URL:}
      app-key: ${DINGTALK_APP_KEY:}
      app-secret: ${DINGTALK_APP_SECRET:}
    feishu:
      enabled: ${FEISHU_ENABLED:false}
      app-id: ${FEISHU_APP_ID:}
      app-secret: ${FEISHU_APP_SECRET:}
      verification-token: ${FEISHU_VERIFICATION_TOKEN:}
      encrypt-key: ${FEISHU_ENCRYPT_KEY:}
    wx:
      # 微信公众号（服务号）：接收用户消息、发送模板消息、客服消息
      mp:
        enabled: ${WX_MP_ENABLED:false}
        app-id: ${WX_MP_APP_ID:}
        secret: ${WX_MP_SECRET:}
        token: ${WX_MP_TOKEN:}
        aes-key: ${WX_MP_AES_KEY:}
      # 微信小程序：登录授权、手机号获取
      mini:
        enabled: ${WX_MINI_ENABLED:false}
        app-id: ${WX_MINI_APP_ID:}
        secret: ${WX_MINI_SECRET:}
  task:
    scheduler:
      pool-size: 4
    queue:
      consumer-threads: 2
      poll-timeout: 5s
  script:
    engine: process # process（开发默认） | graalvm（生产推荐，JVM 内沙箱）
  a2a:
    engine: local # local（内存直调） | agentscope（标准 A2A 协议）
  weather:
    caiyun:
      app-key: ${CAIYUN_APP_KEY:}
      app-secret: ${CAIYUN_APP_SECRET:}

  # AAF 内容创作 Agent（基于 agentscope 2.0 HarnessAgent）
  agentscope:
    assistant:
      enabled: true
      main-agent-id: assistant
      editor-agent-id: editor
      max-iterations: 50
      editor-max-iterations: 20
      # dashscope:qwen-max | openai:gpt-4o | anthropic:claude-3-5-sonnet
      model-id: ${AAF_AGENTSCOPE_MODEL_ID:dashscope:qwen-max}
      fallback-model-id: ${AAF_AGENTSCOPE_FALLBACK_MODEL_ID:}
      # none（本地文件系统，开发默认） | docker（每 session 一个容器，需要预先 docker pull）
      sandbox-type: ${AAF_AGENTSCOPE_SANDBOX_TYPE:none}
      sandbox-image: agentscope/coding-sandbox:latest
      thread-model-call-budget: 200
      global-model-call-limit: 5000
      compaction-trigger-messages: 40
      compaction-keep-messages: 15
      enable-task-list: true

# AgentScope AG-UI 配置
agentscope:
  agui:
    path-prefix: /api/agui
    cors-enabled: true
    cors-allowed-origins: ["*"]
    emit-state-events: true
    emit-tool-call-args: true
    enable-reasoning: true
    enable-path-routing: true
    default-agent-id: assistant
    agent-id-header: X-Agent-Id
    server-side-memory: true
    max-thread-sessions: 1000
    session-timeout-minutes: 30
    run-timeout: 10m
    sse-timeout: 300000
  a2a:
    server:
      # AAF 默认走自有 A2A 引擎（见上方 aaf.a2a.engine=local），AgentScope A2A Server 默认关闭。
      # 该 Server 依赖 ReActAgent Bean 派生 AgentRunner，仅在示例模块开启（dev profile）时才有，
      # 否则 AgentRunner 缺失会导致 agentScopeA2aServer 装配失败、应用启动中止。
      enabled: false
      card:
        name: AAF Supervisor Agent
        description: AAF 多智能体协作框架 - Supervisor Agent，支持日程管理等任务委托
        version: 0.1.0

management:
  info:
    env:
      enabled: true
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: aaf

info:
  app:
    name: ${spring.application.name}
    version: ${spring.application.version}
    description: AI 原生多智能体应用开发框架后端服务

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Flowable：只启用 BPMN + DMN，禁用不使用的引擎以避免产生多余的 ACT_APP_*/ACT_CMMN_*/ACT_FO_* 表
flowable:
  app:
    enabled: false
  cmmn:
    enabled: false
  form:
    enabled: false
