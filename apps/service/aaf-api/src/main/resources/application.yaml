spring:
  application:
    name: aaf
    version: "@project.version@"
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    placeholder-replacement: false
    sql-migration-prefix: v

server:
  servlet:
    context-path: /

aaf:
  app:
    company-name: ${AAF_COMPANY_NAME:学记智能}
  cors:
    allowed-origin-patterns:
      - ${AAF_WEB_ORIGIN:http://localhost:3000}
      - http://127.0.0.1:3000
    allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed-headers: ["*"]
    allow-credentials: true
    max-age: 3600
  ai:
    default-model: default
    fallback-model: default
    # 各能力兜底 modelId，优先级：DB(ai_model_preference) > 此处 > 代码内置默认值
    default-models:
      IMAGE_GEN: qwen-image-plus
      VIDEO_GEN: wan2.6-i2v-flash
      SPEECH_ASR: fun-asr-realtime
      SPEECH_TTS: cosyvoice-v3-flash
      MUSIC_GEN: fun-music-v1
      OMNI_REALTIME: qwen3-omni-flash-realtime
      RERANK: gte-rerank-v2
      EMBEDDING: text-embedding-v3
    prompts:
      chat: 你是一个有帮助的 AI 助手，请用中文回答用户的问题。
  task:
    scheduler:
      pool-size: 4
    queue:
      consumer-threads: 2
      poll-timeout: 5s
  script:
    engine: process # process（开发默认） | graalvm（生产推荐，JVM 内沙箱）
  a2a:
    engine: local # local（内存直调） | agentscope（标准 A2A 协议）

# AgentScope AG-UI 配置
agentscope:
  agui:
    path-prefix: /agui
    cors-enabled: true
    cors-allowed-origins: ["*"]
    emit-state-events: true
    emit-tool-call-args: true
    enable-reasoning: true
    enable-path-routing: true
    default-agent-id: default
    agent-id-header: X-Agent-Id
    server-side-memory: true
    max-thread-sessions: 1000
    session-timeout-minutes: 30
    run-timeout: 10m
    sse-timeout: 300000

management:
  info:
    env:
      enabled: true
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: aaf

info:
  app:
    name: ${spring.application.name}
    version: ${spring.application.version}
    description: AI 原生多智能体应用开发框架后端服务

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Flowable：只启用 BPMN + DMN，禁用不使用的引擎以避免产生多余的 ACT_APP_*/ACT_CMMN_*/ACT_FO_* 表
flowable:
  app:
    enabled: false
  cmmn:
    enabled: false
  form:
    enabled: false
