spring:
  application:
    name: aaf
    version: '@project.version@'
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration-new
    placeholder-replacement: false

server:
  servlet:
    context-path: /

aaf:
  app:
    company-name: ${AAF_COMPANY_NAME:学记智能}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: aaf
