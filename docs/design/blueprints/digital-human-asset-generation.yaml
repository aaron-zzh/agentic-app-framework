# 数字人资产生成 Blueprint
# 版本: v1.0
# 日期: 2026-09-22

name: digital-human-asset-generation
displayName: 数字人资产生成
category: digital_human
version: "1.0.0"
description: 通过提示词或参考图生成数字人形象，配合预设音色创建完整的数字人资产

# 项目规范
projectSpecification:
  # 用户输入的上下文
  requiredContext:
    # 形象描述
    - id: appearance_prompt
      role: user_input
      label: 形象描述
      type: text
      required: true
      placeholder: "25岁职业女性，短发，商务装，温柔微笑"
      helpText: "描述越详细，生成效果越好。包括年龄、性别、发型、服装、表情等"
      validation:
        minLength: 10
        maxLength: 500

    # 参考图片（可选）
    - id: reference_image
      role: user_input
      label: 参考图片
      type: image
      required: false
      helpText: "上传参考图片可以提高生成准确度"
      validation:
        maxSize: 10485760  # 10MB
        formats: ["image/jpeg", "image/png", "image/webp"]

    # 选择音色
    - id: preset_voice
      role: user_input
      label: 选择音色
      type: enum
      required: true
      options:
        - value: aijia
          label: 艾佳 - 温柔亲切
          description: 适合客服场景
        - value: aitong
          label: 艾彤 - 活力甜美
          description: 适合营销推广
        - value: xiaoyun
          label: 小云 - 知性优雅
          description: 适合教育培训
        - value: aicheng
          label: 艾诚 - 专业沉稳
          description: 适合商务场景
        - value: aiwei
          label: 艾伟 - 温和亲切
          description: 适合内容讲解
      default: aijia

# 对象槽位模板
slotTemplates:
  # 数字人形象
  - key: avatar_image
    label: 数字人形象
    objectType: image
    semanticRole: digital_human_avatar
    description: AI 生成的数字人形象图片
    outputContract:
      format: image/png
      aspectRatio: "1:1"
      minResolution: 1024x1024
      maxFileSize: 5242880  # 5MB
    readinessCriteria:
      dependencies: []
      policy: immediate
    candidateSettings:
      maxCandidates: 5
      allowRegeneration: true

# 执行动作
actions:
  # 生成数字人形象
  - key: generate_avatar
    label: 生成形象
    targetSlot: avatar_image
    boundExecutionId: aliyun_image_generation
    description: 使用阿里云图像生成 API 创建数字人形象
    inputMapping:
      prompt: |
        {{appearance_prompt}},
        professional digital human portrait,
        high quality, 4K,
        front facing,
        neutral background,
        studio lighting,
        suitable for video generation
      referenceImage: "{{reference_image}}"
      aspectRatio: "1:1"
      quality: "hd"
      model: "stable-diffusion-xl"
    outputMapping:
      url: "{{execution.output.imageUrl}}"
      metadata:
        originalPrompt: "{{appearance_prompt}}"
        hasReference: "{{reference_image != null}}"
    errorHandling:
      retryPolicy:
        maxRetries: 2
        backoffMultiplier: 2
      fallbackMessage: "形象生成失败，请调整提示词后重试"

# 交付物集合
deliverableSets:
  - key: digital_human_asset
    label: 数字人资产包
    description: 包含形象图片和音色配置的完整数字人资产
    includedSlots:
      - avatar_image

    # 交付后操作：创建数字人实体
    postDeliveryAction:
      type: create_digital_human
      endpoint: POST /api/digital-humans
      inputMapping:
        name: "{{project.name}}"
        description: "{{appearance_prompt}}"
        avatarImageUrl: "{{avatar_image.adoptedVersion.url}}"
        appearance:
          prompt: "{{appearance_prompt}}"
          style: "AI 生成"
        voiceConfig:
          provider: "aliyun"
          presetVoiceId: "{{preset_voice}}"
          speechRate: 0
          pitchRate: 0
          volume: 50
        tags: []
        generationSource: "aigc_project"
        aigcProjectId: "{{project.id}}"
      successMessage: "数字人已创建！[查看详情](/digital-humans/{{response.id}})"
      errorMessage: "数字人创建失败，请联系管理员"

# UI 配置
uiConfig:
  # 创建表单布局
  creationForm:
    layout: vertical
    sections:
      - title: 基础信息
        fields:
          - contextId: appearance_prompt
            widget: textarea
            rows: 4
      - title: 参考图片（可选）
        fields:
          - contextId: reference_image
            widget: image-upload
            preview: true
      - title: 音色配置
        fields:
          - contextId: preset_voice
            widget: radio-cards
            columns: 2

    # 积分消耗提示
    costEstimate:
      enabled: true
      message: "预计消耗约 50 积分"

  # 项目详情页布局
  projectDetail:
    layout: single-column
    showObjectGrid: true
    candidateDisplay: card

    # 自定义操作按钮
    customActions:
      - label: 前往数字人管理
        icon: user
        link: /digital-humans
        position: header
        variant: outline

# 权限配置
permissions:
  # 谁可以创建此类项目
  create:
    - role: user
      condition: "user.credits >= 50"

  # 谁可以查看项目
  view:
    - role: owner
    - role: org_member
      condition: "project.organizationId == user.organizationId"

# 配额限制
quotas:
  maxProjectsPerDay: 10
  maxCandidatesPerSlot: 5

# 标签和元数据
metadata:
  tags:
    - digital-human
    - image-generation
    - ai-avatar
  icon: user-circle
  color: "#6366f1"  # indigo
  documentation: https://docs.example.com/digital-human/generation

# 版本历史
changelog:
  - version: "1.0.0"
    date: "2026-09-22"
    changes:
      - 初始版本
      - 支持文字描述生成形象
      - 支持参考图上传
      - 集成 5 个预设音色
