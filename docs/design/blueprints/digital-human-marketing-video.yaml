# 数字人营销视频生成 Blueprint
# 版本: v1.0
# 日期: 2026-09-22

name: digital-human-marketing-video
displayName: 数字人营销视频
category: digital_human
version: "1.0.0"
description: 使用数字人生成营销视频内容，支持自动脚本创作和场景编排

# 项目规范
projectSpecification:
  # 用户输入的上下文
  requiredContext:
    # 选择数字人
    - id: digital_human
      role: reference
      label: 选择数字人
      type: digital_human_ref
      required: true
      helpText: "选择用于生成视频的数字人形象"
      validation:
        resourceType: digital_human
        status: active

    # 视频主题
    - id: video_topic
      role: user_input
      label: 视频主题
      type: text
      required: true
      placeholder: "介绍我们的 SaaS 产品核心功能和优势"
      helpText: "描述视频要表达的主题内容"
      validation:
        minLength: 10
        maxLength: 500

    # 目标时长
    - id: target_duration
      role: user_input
      label: 目标时长（秒）
      type: number
      required: true
      default: 30
      helpText: "单段最大 15 秒，总长最大 600 秒（10 分钟）"
      validation:
        min: 5
        max: 600

    # 视频风格
    - id: video_style
      role: user_input
      label: 视频风格
      type: enum
      required: true
      options:
        - value: professional
          label: 专业
          description: 正式、严谨、商务场景
        - value: casual
          label: 休闲
          description: 轻松、自然、日常交流
        - value: energetic
          label: 活力
          description: 热情、激昂、激励场景
      default: professional

    # 画面比例
    - id: aspect_ratio
      role: user_input
      label: 画面比例
      type: enum
      required: true
      options:
        - value: "16:9"
          label: 横屏 16:9
          description: 适合电脑、电视播放
        - value: "9:16"
          label: 竖屏 9:16
          description: 适合手机、短视频平台
        - value: "1:1"
          label: 方形 1:1
          description: 适合社交媒体
      default: "16:9"

# 对象槽位模板
slotTemplates:
  # 视频脚本
  - key: script
    label: 视频脚本
    objectType: document
    semanticRole: video_script
    description: AI 生成的分段脚本，包含场景配置
    outputContract:
      format: application/json
      schema:
        type: object
        properties:
          totalDuration:
            type: number
            description: 总时长（秒）
          scenes:
            type: array
            description: 场景列表
            items:
              type: object
              properties:
                order:
                  type: number
                title:
                  type: string
                content:
                  type: string
                duration:
                  type: number
                sceneDescription:
                  type: string
    readinessCriteria:
      dependencies: []
      policy: immediate
    candidateSettings:
      maxCandidates: 3
      allowRegeneration: true
      allowManualEdit: true

  # 数字人视频
  - key: video
    label: 数字人视频
    objectType: video
    semanticRole: marketing_video
    description: 生成的数字人播报视频
    outputContract:
      format: video/mp4
      minDuration: 5
      maxDuration: 600
      codec: h264
      maxFileSize: 104857600  # 100MB
    readinessCriteria:
      dependencies:
        - script
      policy: after_dependency
    candidateSettings:
      maxCandidates: 2
      allowRegeneration: true

# 执行动作
actions:
  # 1. 生成视频脚本
  - key: generate_script
    label: 生成脚本
    targetSlot: script
    boundExecutionId: aigc_text_generation
    description: 使用 Claude 生成分段视频脚本
    inputMapping:
      prompt: |
        创作一个 {{target_duration}} 秒的营销视频脚本，主题：{{video_topic}}

        视频风格：{{video_style}}
        数字人信息：
        - 名称：{{digital_human.name}}
        - 性别：{{digital_human.appearance.gender}}
        - 音色：{{digital_human.voiceConfig.voiceName}}

        要求：
        1. 根据时长自动分段（单段不超过 15 秒）
        2. 每段包含：顺序、标题、内容、时长、场景描述
        3. 语言简洁有力，适合数字人播报
        4. 内容符合视频风格定位
        5. 总时长尽量接近目标时长

        返回严格的 JSON 格式：
        {
          "totalDuration": 数字,
          "scenes": [
            {
              "order": 1,
              "title": "开场",
              "content": "具体的播报文案",
              "duration": 15,
              "sceneDescription": "场景描述（如：正面特写、微笑表情）"
            }
          ]
        }

        注意：
        - 每段 content 字数要与 duration 匹配（约 3-4 字/秒）
        - 不要包含 markdown 代码块标记
        - 直接返回 JSON 对象
      model: "claude-sonnet-5"
      temperature: 0.8
      maxTokens: 2000
      responseFormat: json
    outputMapping:
      content: "{{execution.output.text}}"
      metadata:
        generatedAt: "{{execution.completedAt}}"
        model: "{{execution.model}}"
    errorHandling:
      retryPolicy:
        maxRetries: 2
      fallbackMessage: "脚本生成失败，请调整主题后重试"

  # 2a. 简单视频生成（≤15 秒）
  - key: generate_video_simple
    label: 生成视频（简单）
    targetSlot: video
    boundExecutionId: aliyun_video_generation
    description: 使用阿里云生成单段视频
    condition: "{{target_duration}} <= 15"
    inputMapping:
      prompt: "数字人播报视频，内容：{{script.adoptedVersion.content.scenes[0].content}}"
      referenceImage: "{{digital_human.avatarImageUrl}}"
      voiceConfig:
        provider: "aliyun"
        voiceId: "{{digital_human.voiceConfig.presetVoiceId}}"
        speechRate: "{{digital_human.voiceConfig.speechRate}}"
        pitchRate: "{{digital_human.voiceConfig.pitchRate}}"
        volume: "{{digital_human.voiceConfig.volume}}"
      duration: "{{target_duration}}"
      aspectRatio: "{{aspect_ratio}}"
      resolution: "1080p"
    outputMapping:
      url: "{{execution.output.videoUrl}}"
      duration: "{{execution.output.duration}}"
      metadata:
        generationMethod: simple
        provider: aliyun
    costTracking:
      operation: simple_video
      baseCredits: 20
      perSecondCredits: 5

  # 2b. 复杂视频生成（>15 秒）
  - key: generate_video_hyperframes
    label: 生成视频（复杂）
    targetSlot: video
    boundExecutionId: hyperframes_integration
    description: 使用 Hyperframes 生成多段拼接视频
    condition: "{{target_duration}} > 15"
    inputMapping:
      digitalHumanId: "{{digital_human.id}}"
      avatarImageUrl: "{{digital_human.avatarImageUrl}}"
      voiceConfig: "{{digital_human.voiceConfig}}"
      scenes: "{{script.adoptedVersion.content.scenes}}"
      aspectRatio: "{{aspect_ratio}}"
      resolution: "1080p"

      # 全局配置（可选）
      globalConfig:
        backgroundMusic:
          enabled: false
        brandElements:
          logo: null
          watermark: null
    outputMapping:
      url: "{{execution.output.videoUrl}}"
      duration: "{{execution.output.duration}}"
      metadata:
        generationMethod: complex
        provider: hyperframes
        sceneCount: "{{script.adoptedVersion.content.scenes.length}}"
    costTracking:
      operation: complex_video
      baseCredits: 50
      perSecondCredits: 10
      perSceneCredits: 20

# 交付物集合
deliverableSets:
  - key: marketing_video_package
    label: 营销视频包
    description: 包含脚本和视频的完整交付物
    includedSlots:
      - script
      - video

    # 交付后操作：更新数字人使用统计
    postDeliveryAction:
      type: update_digital_human_stats
      endpoint: POST /api/digital-humans/{{digital_human.id}}/usage-stats
      inputMapping:
        videoCount: 1
        duration: "{{video.adoptedVersion.metadata.duration}}"
        creditsConsumed: "{{project.totalCreditsConsumed}}"
      successMessage: "视频已生成！[下载视频]({{video.adoptedVersion.url}})"

# UI 配置
uiConfig:
  # 创建表单布局
  creationForm:
    layout: vertical
    sections:
      - title: 选择数字人
        fields:
          - contextId: digital_human
            widget: digital-human-selector
            preview: true
      - title: 视频内容
        fields:
          - contextId: video_topic
            widget: textarea
            rows: 3
          - contextId: target_duration
            widget: number-input
            unit: 秒
            step: 5
      - title: 视频配置
        fields:
          - contextId: video_style
            widget: radio-cards
            columns: 3
          - contextId: aspect_ratio
            widget: radio-buttons
            inline: true

    # 动态积分估算
    costEstimate:
      enabled: true
      formula: |
        if (target_duration <= 15) {
          return 20 + target_duration * 5
        } else {
          const scenes = Math.ceil(target_duration / 15)
          return 50 + target_duration * 10 + scenes * 20
        }

  # 项目详情页布局
  projectDetail:
    layout: two-column
    leftColumn:
      - objectKey: script
        expanded: true
        customEditor: scene-editor
    rightColumn:
      - objectKey: video
        videoPlayer: true

    # 脚本编辑器配置
    customEditors:
      scene-editor:
        type: json-form
        schema:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                label: 场景标题
              content:
                type: string
                label: 播报内容
                widget: textarea
              duration:
                type: number
                label: 时长（秒）
              sceneDescription:
                type: string
                label: 场景描述
                optional: true
        features:
          - reorder
          - add-scene
          - delete-scene
          - preview-scene

# 权限配置
permissions:
  create:
    - role: user
      condition: "user.hasActiveDigitalHuman == true"
  view:
    - role: owner
    - role: org_member

# 配额限制
quotas:
  maxProjectsPerDay: 20
  maxDurationPerProject: 600
  maxCandidatesPerSlot: 2

# 通知配置
notifications:
  # 视频生成完成通知
  - event: slot_ready
    slotKey: video
    channels:
      - type: in-app
        message: "您的数字人视频已生成完成"
      - type: email
        condition: "project.metadata.notifyEmail == true"
        subject: "数字人视频生成完成"
        template: video-generation-complete

# 标签和元数据
metadata:
  tags:
    - digital-human
    - video-generation
    - marketing
  icon: video
  color: "#8b5cf6"  # purple
  documentation: https://docs.example.com/digital-human/video
  estimatedDuration: "3-5 分钟"
  complexity: medium

# 版本历史
changelog:
  - version: "1.0.0"
    date: "2026-09-22"
    changes:
      - 初始版本
      - 支持简单视频生成（≤15秒）
      - 支持复杂视频生成（>15秒，Hyperframes）
      - 自动脚本创作
      - 场景编辑器
      - 多种画面比例
