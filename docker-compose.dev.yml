# AAF Docker Compose - 本地开发环境
# 只启动基础设施，前后端在本地直接运行（热重载）
#
# 使用方式：
#   docker compose -f docker-compose.dev.yml up -d
#   pnpm nx serve service    # 后端 :8080
#   pnpm nx dev webui        # 前端 :3000

services:
  postgres:
    build:
      context: ./scripts/deploy/postgres
      dockerfile: Dockerfile
    container_name: aaf-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME:-aaf-dev}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--locale=zh_CN.utf8 --encoding=UTF8"
      LANG: zh_CN.utf8
      LC_ALL: zh_CN.utf8
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/create_chinese_db.sh:/docker-entrypoint-initdb.d/01_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: aaf-redis-dev
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data

  neo4j:
    image: neo4j:5-community
    container_name: aaf-neo4j-dev
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j}
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
  neo4j_dev_data:
