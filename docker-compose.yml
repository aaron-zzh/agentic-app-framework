# AAF Docker Compose - 开发/演示环境
# 使用方式：cp .env.example .env && docker compose up -d
# Neo4j 使用外部服务（线上版），在 .env 中配置 NEO4J_URI

services:
  # PostgreSQL + PgVector（含中文 locale）
  postgres:
    build:
      context: ./scripts/deploy/postgres
      dockerfile: Dockerfile
    container_name: aaf-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-aaf-dev}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--locale=zh_CN.utf8 --encoding=UTF8"
      LANG: zh_CN.utf8
      LC_ALL: zh_CN.utf8
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create_chinese_db.sh:/docker-entrypoint-initdb.d/01_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7.4-alpine
    container_name: aaf-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 后端服务
  aaf-service:
    image: ${ACR_REGISTRY}/service:${IMAGE_TAG:-latest}
    container_name: aaf-service
    env_file:
      - .env
    environment:
      # 覆盖 .env 中的地址为容器内网地址
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./logs/service:/app/logs
      - service_heap:/tmp/heap-dumps
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 前端服务
  aaf-webui:
    image: ${ACR_REGISTRY}/webui:${IMAGE_TAG:-latest}
    container_name: aaf-webui
    environment:
      NEXT_PUBLIC_API_URL: http://aaf-service:8080
    ports:
      - "3000:3000"
    depends_on:
      - aaf-service

  # Nginx 反向代理
  nginx:
    image: nginx:1.28-alpine
    container_name: aaf-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/aaf.conf:/etc/nginx/conf.d/aaf.conf:ro
      - ${SSL_CERT_DIR}:/etc/ssl/aaf:ro   # 必须在 .env 中配置，如 SSL_CERT_DIR=/root/aaf/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - aaf-service
      - aaf-webui
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  service_heap:
