# AAF Docker Compose - 开发/演示环境
# 使用方式：cp .env.example .env && docker compose up -d

services:
  # PostgreSQL + PgVector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aaf-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-aaf-dev}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Neo4j 图数据库
  neo4j:
    image: neo4j:5-community
    container_name: aaf-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "${NEO4J_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: aaf-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 后端服务
  aaf-service:
    build:
      context: ./apps/service
      dockerfile: Dockerfile
    container_name: aaf-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aaf-dev}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-aaf-dev-secret-must-be-at-least-32-bytes-long!!}
      JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-7200}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 前端服务
  aaf-webui:
    build:
      context: ./apps/webui
      dockerfile: Dockerfile
    container_name: aaf-webui
    environment:
      NEXT_PUBLIC_API_URL: http://aaf-service:8080
    ports:
      - "3000:3000"
    depends_on:
      - aaf-service

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
