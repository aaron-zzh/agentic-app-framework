# AAF EMQX 5.10 单节点开发配置。
# TLS 文件由 docker-compose.emqx.yml 从宿主机 EMQX_CERT_DIR 只读挂载，仓库不保存证书或私钥。

listeners.tcp.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false

listeners.ssl.default {
  enable = true
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/aaf/ca.pem"
    certfile = "/opt/emqx/etc/certs/aaf/cert.pem"
    keyfile = "/opt/emqx/etc/certs/aaf/key.pem"
    versions = ["tlsv1.3", "tlsv1.2"]
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

# 每台设备使用独立用户名和密码。AAF 在 #12008 实现认证端点并返回 allow/deny。
authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://host.docker.internal:8080/api/internal/emqx/auth"
    headers {
      "Content-Type" = "application/json"
      "X-Emqx-Secret" = "${AAF_EMQX_SHARED_SECRET}"
    }
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
      peerhost = "${peerhost}"
    }
    connect_timeout = "5s"
    request_timeout = "5s"
    pool_size = 8
    enable_pipelining = 100
  }
]

# AAF 在 #12008 按 clientId/username、action 与 topic 限制设备只能操作自身主题。
authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://host.docker.internal:8080/api/internal/emqx/acl"
      headers {
        "Content-Type" = "application/json"
        "X-Emqx-Secret" = "${AAF_EMQX_SHARED_SECRET}"
      }
      body {
        clientid = "${clientid}"
        username = "${username}"
        action = "${action}"
        topic = "${topic}"
        qos = "${qos}"
        retain = "${retain}"
        peerhost = "${peerhost}"
      }
      connect_timeout = "5s"
      request_timeout = "5s"
      pool_size = 8
      enable_pipelining = 100
    }
  ]
}
